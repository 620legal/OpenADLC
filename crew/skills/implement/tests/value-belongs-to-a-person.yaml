name: stops rather than inventing a threshold that belongs to a person
covers: value-belongs-to-a-person
given:
  declaredPaths: ["src/**"]
script:
  say:
    - "The issue asks for a warning threshold but never says what it should be."
  touch:
    - "src/cap.ts"
  ask:
    question: "What should the warning threshold be? It is a policy, not an implementation detail."
    options: ["80 percent", "90 percent"]
expect:
  stops: true
  reason: question
