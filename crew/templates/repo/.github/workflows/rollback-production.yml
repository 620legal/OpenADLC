# SPDX-License-Identifier: Apache-2.0 OR 0BSD

name: rollback-production

# Sends production traffic back to what served before the last traffic shift.
# OpenADLC dispatches it, as its app, only when a promote it dispatched failed
# at its traffic shift; a promote that failed before the shift left production
# as it was, and is not rolled back. Anyone may run it by hand.
#
# It runs in the `production-rollback` environment, which `fleetadlc github
# apply` makes with no reviewer and no wait timer, so a rollback never waits,
# and holds to the default branch alone. Keep the credential that shifts
# production's traffic in that environment's secrets (or an OIDC trust pinned to
# it), never in a repository secret: those any workflow on any branch can read.
# What it runs is the Makefile's `rollback-production` target; TO, when given,
# is the revision to go back to.

on:
  workflow_dispatch:
    inputs:
      to:
        description: The revision to send traffic back to. Empty is the one serving before the last shift.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Shared with promote-production: traffic has one shape at a time.
  group: production-traffic
  cancel-in-progress: false

jobs:
  rollback-production:
    name: rollback-production
    # The environment's branch policy is what holds: a dispatch runs the
    # dispatched branch's copy of this file, which can drop this line.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: production-rollback
    runs-on: ubuntu-latest
    steps:
      - name: check the revision
        # Read through the environment, never `${{ }}` in the script: `to` is
        # free text, and an expression is pasted in before bash reads it.
        env:
          TO: ${{ inputs.to }}
        run: |
          if [[ -n "$TO" && ! "$TO" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
            echo "'to' must be a revision tag: letters, digits, '.', '_' and '-', at most 128 of them, or empty for the previous revision." >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: roll back
        env:
          TO: ${{ inputs.to }}
        run: make rollback-production TO="$TO"
