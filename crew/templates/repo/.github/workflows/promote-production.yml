name: promote-production
# OpenADLC reads the candidate from the run's name, because a
# `deployment_status` delivery carries no inputs; keep it.
run-name: promote-production ${{ inputs.candidate }}${{ inputs.emergency_override != '' && ' (emergency override)' || '' }}

# Promotes a commit that is live and smoked on testing. OpenADLC dispatches it,
# as its app, once the smoke is green and `.github/fleetadlc.yml` says
# `production: on: after-testing`. The `production` environment holds it as the
# repository's GitHub rules say: until a required reviewer approves it, or for
# its wait timer. A bot never approves a deploy; the repository's GitHub rules
# do. Whoever dispatches it, the job first checks the commit is live and smoked
# on testing, unless a person with admin or maintain overrides that check.
#
# One job, so one approval covers the whole promote. What it runs is the
# Makefile's `promote-production` target, given the commit as CANDIDATE.

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: The commit to promote, by its full 40-character id (`git rev-parse <short>` gives it), on the default branch and live on testing.
        required: true
        type: string
      emergency_override:
        description: Leave empty. For an emergency only, by a person with admin or maintain on the repository - why this commit goes to production without being live and smoked on testing. The run is named as an override and the reason is recorded; a bot is refused.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  deployments: write
  # The testing check reads the smoke's runs.
  actions: read

concurrency:
  # Shared with rollback-production: traffic has one shape at a time.
  group: production-traffic
  cancel-in-progress: false

jobs:
  promote-production:
    name: promote-production
    runs-on: ubuntu-latest
    environment:
      name: production
      # The revision URL the promote printed: OpenADLC's "Live on production" link.
      url: ${{ steps.deploy.outputs.revision-url }}
    steps:
      - name: the candidate is a commit id
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if ! printf '%s' "$CANDIDATE" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "candidate must be a full 40-character commit id, not \"$CANDIDATE\"; pass the whole id (git rev-parse <short> prints it). Refusing to promote it"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.candidate }}
          fetch-depth: 0

      - name: the candidate is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "$(git rev-parse HEAD) is not on $DEFAULT_BRANCH; refusing to promote it"
            exit 1
          fi

      # Live and smoked on testing, whoever dispatched this. The bridge
      # dispatches only a smoked commit, but anyone with write access can
      # dispatch this by hand, crew tokens included, and under `approval: auto`
      # nothing else stands between that and production. The proof is the
      # bridge's own, by the runs' names: GitHub records the deployment and a
      # `workflow_run` smoke at the default branch's tip when they were
      # created, which is another merge's once two land close together.
      #
      # An emergency override skips it, for a person with admin or maintain
      # who gives a reason; never for a bot. OpenADLC never sets it.
      - name: the candidate is live and smoked on testing
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
          REASON: ${{ inputs.emergency_override }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The smoke's workflow file, without `.yml`: keep it equal to
          # `testing.smoke` in .github/fleetadlc.yml.
          SMOKE_WORKFLOW: smoke-testing
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ -n "$REASON" ]; then
            case "$ACTOR" in
              *'[bot]')
                echo "$ACTOR is a bot; only a person with admin or maintain on $GITHUB_REPOSITORY may pass emergency_override. Refusing to promote $sha"
                exit 1 ;;
            esac
            role="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.role_name')"
            case "$role" in
              admin | maintain) ;;
              *)
                echo "$ACTOR has $role on $GITHUB_REPOSITORY; emergency_override takes admin or maintain. Refusing to promote $sha"
                exit 1 ;;
            esac
            {
              echo "### emergency override"
              echo
              echo "- candidate \`$sha\`, promoted without the testing check"
              echo "- by $ACTOR ($role)"
              echo "- reason: $REASON"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "emergency override by $ACTOR: $sha is promoted without the testing check"
            exit 0
          fi
          branch="${DEFAULT_BRANCH:-}"
          if [ -z "$branch" ]; then
            echo "the default branch was not given; refusing to promote $sha"
            exit 1
          fi
          # The deploy the bridge dispatched for this commit, on this repository's
          # default branch. A run titled for the commit but dispatched on another
          # branch, or from a fork, is not it.
          deploy_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-testing.yml/runs?event=workflow_dispatch&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.display_title == \"deploy-testing $sha\" and .head_branch == \"$branch\" and .event == \"workflow_dispatch\" and ((.head_repository.full_name // \"$GITHUB_REPOSITORY\") == \"$GITHUB_REPOSITORY\"))][0].id // empty")"
          if [ -z "$deploy_id" ]; then
            echo "$sha has no successful deploy-testing run on $branch titled \"deploy-testing $sha\"; promote a commit the bridge deployed, or a person with admin passes emergency_override with a reason"
            exit 1
          fi
          # The smoke workflow_run names itself from that deploy's title. A smoke
          # dispatched by hand, whatever commit it points at, has another name and
          # another event, so it does not count. Skipped and cancelled runs smoked
          # nothing. GitHub lists newest first.
          smoke="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$SMOKE_WORKFLOW.yml/runs?event=workflow_run&status=completed&per_page=100" \
            --jq "[.workflow_runs[] | select(.display_title == \"$SMOKE_WORKFLOW of deploy-testing $sha\" and .event == \"workflow_run\" and .conclusion != \"skipped\" and .conclusion != \"cancelled\")][0].conclusion // empty")"
          if [ "$smoke" != success ]; then
            echo "$sha has no green $SMOKE_WORKFLOW run titled \"$SMOKE_WORKFLOW of deploy-testing $sha\" (its latest is ${smoke:-none}); wait for it, or a person with admin passes emergency_override with a reason"
            exit 1
          fi
          # The testing deployment is the one that deploy run recorded. Its commit
          # is the branch tip at dispatch, so it is found from the run, not by
          # sha. A newer deploy of the same environment marks the earlier success
          # inactive; that still counts.
          deployment=""
          state=""
          ids="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=testing&per_page=20" --jq '.[].id')"
          for id in $ids; do
            verdict="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=20" --jq \
              'if any(.[]; (.log_url // "") | test("/runs/'"$deploy_id"'(/|$)")) then
                 if .[0].state == "success" then "live"
                 elif .[0].state == "inactive" and any(.[]; .state == "success") then "replaced"
                 else (.[0].state // "none") end
               else "" end')"
            if [ -n "$verdict" ]; then
              deployment="$id"
              state="$verdict"
              break
            fi
          done
          if [ -z "$deployment" ]; then
            echo "$sha's deploy-testing run $deploy_id has no testing deployment; promote a commit that is live there, or a person with admin passes emergency_override with a reason"
            exit 1
          fi
          case "$state" in
            live)
              echo "$sha is live on testing (deployment $deployment, deploy-testing run $deploy_id) and its smoke is green" ;;
            replaced)
              # Not live any more: what is proven is that it was, and smoked green.
              echo "$sha reached testing (deployment $deployment, deploy-testing run $deploy_id), a newer deploy has since replaced it there, and its smoke is green" ;;
            *)
              echo "$sha's testing deployment is ${state:-without a status}, not success; wait for it, or a person with admin passes emergency_override with a reason"
              exit 1 ;;
          esac

      - name: promote
        id: deploy
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          # pipefail: without it `make … | tee` exits 0 when the target fails,
          # and a failed promote is reported as a success.
          make promote-production CANDIDATE="$CANDIDATE" | tee "$RUNNER_TEMP/deploy.log"
          # The target's last line is the deployed revision's URL. GitHub hands
          # it to OpenADLC as the deployment's environment_url, which goes on
          # the pull request. A target that prints none still ships; the pull
          # request then says the deploy reported no revision URL.
          url="$(tail -n 1 "$RUNNER_TEMP/deploy.log")"
          if printf '%s' "$url" | grep -Eq '^https?://[^[:space:]]+$'; then
            echo "revision-url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the promote-production target printed no revision URL on its last line"
          fi
