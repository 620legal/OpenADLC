name: deploy-testing
# OpenADLC reads the deployed commit from the run's name: the deployment
# GitHub records is at the default branch's tip when the run was dispatched,
# which is another merge's once two land close together. Keep it.
run-name: deploy-testing ${{ inputs.sha }}

# Deploys a merged commit to testing. OpenADLC dispatches it, as its app, when
# a pull request merges and `.github/fleetadlc.yml` says `testing: on: merge`;
# nothing else starts it, so one merge is one deploy.
#
# What it runs is the repository's own: the Makefile's `deploy-testing` target,
# given the commit as SHA. It labels nothing and moves no card: the job names
# the `testing` environment, GitHub records a deployment, and OpenADLC acts on
# its `deployment_status`. Keep the job's name the workflow's name, which is
# what OpenADLC matches on.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The merged commit to deploy, on the default branch.
        required: true
        type: string

permissions:
  contents: read
  # GitHub creates the deployment because the job names an environment.
  deployments: write

concurrency:
  # Testing has one occupant; a second merge waits for the first. GitHub holds
  # one run waiting, and a third merge replaces it rather than queueing: the
  # replaced merge goes out inside the newer one, and OpenADLC finishes every
  # pull request merged since what testing served before.
  group: deploy-testing
  cancel-in-progress: false

jobs:
  deploy-testing:
    name: deploy-testing
    # Skipped until the repository says it has somewhere to deploy to, with the
    # Actions variable FLEETADLC_DEPLOY_TESTING set to `true`. The Makefile's
    # stub refuses, and a green deploy of nothing would label a change live on
    # testing when it is live nowhere. Skipped is neither red nor green, so it
    # starts nothing: the merged change waits on testing.
    if: vars.FLEETADLC_DEPLOY_TESTING == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testing
      # The revision URL the deploy printed: OpenADLC's "Live on testing" link.
      url: ${{ steps.deploy.outputs.revision-url }}
    steps:
      # A full commit id, which is what the run's name has to carry; anything
      # else is refused before it is checked out.
      - name: the commit is a commit id
        env:
          SHA: ${{ inputs.sha }}
        run: |
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "sha must be a full 40-character commit id, not \"$SHA\"; refusing to deploy it"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      # Nothing that is not on the default branch is deployed.
      - name: the commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "$(git rev-parse HEAD) is not on $DEFAULT_BRANCH; refusing to deploy it"
            exit 1
          fi

      - name: deploy
        id: deploy
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # pipefail: without it `make … | tee` exits 0 when the target fails,
          # and a failed deploy is reported as a success.
          make deploy-testing SHA="$SHA" | tee "$RUNNER_TEMP/deploy.log"
          # The target's last line is the deployed revision's URL. GitHub hands
          # it to OpenADLC as the deployment's environment_url, which goes on
          # the pull request. A target that prints none still ships; the pull
          # request then says the deploy reported no revision URL.
          url="$(tail -n 1 "$RUNNER_TEMP/deploy.log")"
          if printf '%s' "$url" | grep -Eq '^https?://[^[:space:]]+$'; then
            echo "revision-url=$url" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the deploy-testing target printed no revision URL on its last line"
          fi
