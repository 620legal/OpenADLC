# Deploys a merged commit to testing. OpenADLC dispatches it, as its app, when
# a pull request merges; nothing else starts it, so one merge is one deploy. It
# used to run on every push to main as well, and with the bridge's dispatch on
# top each merge deployed and smoked twice.
#
# What this workflow does *not* do is label the pull request, post the revision
# URL or move the card. Actions taken with a workflow's token fire no further
# events, so a label set from here would be a dead end. What it produces instead
# is a GitHub deployment on the `testing` environment; `deployment_status` is
# the event, and `apps/bridge/src/webhooks.ts` is what acts on it.
name: deploy-testing
# The bridge reads the deployed commit from the run's name: the deployment
# GitHub records is at the default branch's tip when the run was dispatched,
# which is another merge's once two land close together. Keep it.
run-name: deploy-testing ${{ inputs.sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The merged commit to deploy, on the default branch.
        required: true
        type: string

permissions:
  contents: read
  # The deployment is created by GitHub on this job's behalf because the job
  # names an environment. Nothing here writes through the API.
  deployments: write

concurrency:
  # Testing has one occupant. A second merge waits for the first rather than
  # racing it, because two revisions arriving out of order is how a green smoke
  # ends up attributed to the wrong commit. GitHub holds one run waiting: a
  # third merge replaces the waiting one, not queues behind it. Nothing is lost,
  # because the bridge finishes every pull request merged since what testing
  # served before, not only the deployed commit's.
  group: deploy-testing
  cancel-in-progress: false

jobs:
  # The job's name is the check context, and it is deliberately the same string
  # as the workflow's name: the bridge matches `deploy-testing` on
  # `workflow_run.name`, and keeping the two identical means the match holds
  # whichever of them a given event carries.
  deploy-testing:
    name: deploy-testing
    # Without a testing target there is nothing to deploy, and a green deploy of
    # nothing would put `deployed:testing` on a pull request that is live
    # nowhere — which is a lie in the system of record, and one the dependency
    # logic would act on. Skipped is not failed, so this starts no revert.
    if: vars.FLEETADLC_DEPLOY_TESTING == 'true'
    runs-on: ubuntu-latest

    environment:
      name: testing
      # Carried to the bridge as `deployment_status.environment_url`, which is
      # the revision URL that ends up on the pull request.
      url: ${{ steps.deploy.outputs.revision-url }}

    steps:
      # A full commit id, which is what the run's name has to carry; anything
      # else is refused before it is checked out.
      - name: the commit is a commit id
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "sha must be a full 40-character commit id, not \"$SHA\"; refusing to deploy it"
            exit 1
          fi

      # Full history: the ancestry check below needs the default branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: the candidate is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # "Deploy nothing that is not on the default branch" is the one thing
          # the deploy role may never do, so it is a check and not a rule.
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "$(git rev-parse HEAD) is not on $DEFAULT_BRANCH; refusing to deploy it"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build the release artifact
        run: make build

      - name: deploy it to testing
        id: deploy
        run: |
          set -euo pipefail
          # `make deploy-testing` is the repository's half of the contract, the
          # same way `make ci` is. Its last line of output is the URL of the
          # revision it just created, and that URL is what the builder is told
          # to verify against.
          make deploy-testing | tee /tmp/deploy-testing.log
          url="$(tail -n 1 /tmp/deploy-testing.log)"
          if [ -z "$url" ]; then
            echo "make deploy-testing printed no revision URL on its last line"
            exit 1
          fi
          echo "revision-url=$url" >> "$GITHUB_OUTPUT"

      - name: what was deployed
        # Whatever `make deploy-testing` printed last, so through the
        # environment rather than pasted into the script.
        env:
          URL: ${{ steps.deploy.outputs.revision-url }}
        run: |
          {
            echo "### testing"
            echo
            echo "- commit \`$(git rev-parse HEAD)\`"
            echo "- revision $URL"
          } >> "$GITHUB_STEP_SUMMARY"
