name: ci

# Written by `fleetadlc github apply` because the repository had no workflow.
#
# The merge line lands a pull request only once a check named `ci` has passed
# on its head, so this job keeps that name. What it runs is the repository's
# own: the Makefile's `setup` and `ci` targets, which AGENTS.md says a pull
# request has to pass. Change the steps freely; keep the job called `ci`.
#
# On a crew pull request (an `agent/` branch) it runs only once the pull
# request carries `adlc:ci`, which FleetADLC's merge line puts on after the lead
# reviewer approved, when it is at the front of the line: the builder ran
# `make ci` on its head already, and the runner minutes go to the head that
# lands. A person's pull request and a push to main run as they always did.
# Skipped, a job named `ci` would still report a `ci` check that branch rules
# count as passing, so the job is named `ci` only when it runs.
#
# Runner minutes are this repository's bill, so it runs only what a change needs:
# - a change to docs alone (docs/, Markdown at the root or directly under
#   .github/, the licence files) passes without `make setup` or `make ci`. Set
#   DOCS_ALONE_SKIPS to 'false' below if your tests read your docs;
# - the push to main that lands a tree a pull request already passed runs
#   nothing again. The merge line lands a pull request only once it is up to
#   date and green, so the merge is the tree that was tested;
# - a run that hangs stops after 30 minutes, not GitHub's six hours.
# To make each run cheaper still, cache your dependencies in `make setup`'s
# step (actions/cache, or setup-node's `cache:`, keyed on your lockfile).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:

# It reads the code and writes nothing. `actions: read` is to ask whether a
# pull request's run already passed the tree a push lands.
permissions:
  contents: read
  actions: read

env:
  DOCS_ALONE_SKIPS: 'true'

# A label event that runs nothing is in a group of its own, so it never
# cancels a run that is testing the head.
concurrency:
  group: ci-${{ github.ref }}-${{ (github.event_name != 'pull_request' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'adlc:ci' || github.event.label.name == 'scope:cross-cutting') && (!startsWith(github.head_ref, 'agent/') || contains(github.event.pull_request.labels.*.name, 'adlc:ci'))) && 'run' || 'deferred' }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ (github.event_name != 'pull_request' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'adlc:ci' || github.event.label.name == 'scope:cross-cutting') && (!startsWith(github.head_ref, 'agent/') || contains(github.event.pull_request.labels.*.name, 'adlc:ci'))) && 'ci' || 'ci (after approval)' }}
    if: ${{ github.event_name != 'pull_request' || ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'adlc:ci' || github.event.label.name == 'scope:cross-cutting') && (!startsWith(github.head_ref, 'agent/') || contains(github.event.pull_request.labels.*.name, 'adlc:ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Two commits: a pull request's merge commit and the base it is tested
      # against, or a push and the commit before it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: what this change needs
        id: needs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          run=true
          # A pull request's own runs only: a fork's run is the fork's
          # workflow, and could name any tree.
          if [ "$EVENT" = push ]; then
            count=$(gh api "repos/$REPO/actions/artifacts?name=tested-tree-$tree" \
              --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == $REPO_ID)] | length" 2>/dev/null || echo 0)
            if [ "${count:-0}" -gt 0 ]; then
              echo "this tree passed on its pull request; nothing to run again"
              run=false
            fi
          fi
          # More than one commit pushed at once: the diff below would not see
          # them all, so it runs.
          if [ "$run" = true ] && [ "$DOCS_ALONE_SKIPS" = true ] && { [ "$EVENT" != push ] || [ "$BEFORE" = "$(git rev-parse HEAD~1 2>/dev/null)" ]; }; then
            files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            outside=$(printf '%s\n' "$files" | grep -Ev '^(docs/|LICENSE$|NOTICE$|[^/]+\.md$|\.github/[^/]+\.md$|\.github/ISSUE_TEMPLATE/)' | grep -v '^$' || true)
            if [ -n "$files" ] && [ -z "$outside" ]; then
              echo "docs alone changed; nothing to build or test"
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: make setup
        if: steps.needs.outputs.run == 'true'
        run: make setup

      - name: make ci
        if: steps.needs.outputs.run == 'true'
        run: make ci

      # So the push to main that lands this exact tree runs nothing again.
      - name: remember the tree that passed
        if: github.event_name == 'pull_request' && steps.needs.outputs.run == 'true'
        run: echo "${{ steps.needs.outputs.tree }}" > tested-tree.txt

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && steps.needs.outputs.run == 'true'
        with:
          name: tested-tree-${{ steps.needs.outputs.tree }}
          path: tested-tree.txt
          retention-days: 14
