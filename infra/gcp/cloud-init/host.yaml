#cloud-config
#
# The host, on Container-Optimized OS.
#
# Three things run here: the platform's log agent (turned on by metadata), so
# the host is visible; a forward proxy holding the egress allowlist; and hostd,
# which owns the task containers. Before this file the module had no default
# cloud-init at all, so a default cloud install started none of them — no
# hostd, no logging, and an egress allowlist written to a metadata key that
# nothing read.
#
# Docker is already on COS, so nothing installs it. The allowlist is enforced
# twice on purpose: the proxy refuses a destination by name, and the firewall
# below stops a container going round the proxy to an address it resolved
# itself.

write_files:
  # A host made before the rename to OpenADLC kept its state in /var/lib/fleet,
  # under units named fleet-*, and the reset that brings it onto these names
  # keeps its disk: the image hostd last ran on, the bots' sign-ins and the
  # repositories' mirrors are in it. Started from an empty /var/lib/openadlc,
  # hostd would run the module's hostd_image, maybe a release behind the
  # database, with every subscription signed out. So the first boot on these
  # names moves it, before any unit opens either. A host that has both is left
  # as it is and said (docs/runbooks/rename-gcp-host.md). /etc and /run are not
  # kept across boots, so nothing in them moves. Remove once every install has
  # been renamed.
  - path: /etc/openadlc/from-fleet.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -uo pipefail
      old=/var/lib/fleet
      new=/var/lib/openadlc
      [ -e "$old" ] || exit 0
      if [ -e "$new" ]; then
        echo "[openadlc] $old and $new are both here, so $old is left as it is and hostd starts from $new: see docs/runbooks/rename-gcp-host.md" >&2
        exit 1
      fi
      mv "$old" "$new" || { echo "[openadlc] could not move $old to $new, so hostd starts from an empty $new: see docs/runbooks/rename-gcp-host.md" >&2; exit 1; }
      echo "[openadlc] moved $old to $new" >&2

  - path: /etc/openadlc/squid.conf
    permissions: '0644'
    content: |
      # The egress allowlist, by name.
      #
      # HTTPS is not decrypted: a CONNECT names its host, and that name is what
      # is matched. A bot cannot reach an allowed name and then be redirected
      # somewhere else, because the redirect would be its own CONNECT.
      #
      # A leading dot matches subdomains, which is how `objects.githubusercontent.com`
      # and the rest of a CDN stay reachable without opening the parent domain.
      #
      # `-n` matches only the name the request gives. Without it, a request to a
      # bare IP address was matched by that address's reverse-DNS name, which
      # whoever holds the address sets: an address named `x.github.com` passed
      # as `.github.com`. A bare address, IPv4 or bracketed IPv6 (or anything
      # with a colon, which no name has), is refused outright below as well, so
      # the refusal is plain in the log.
      acl allowed_domains dstdomain -n ${allowed_domains}
      # And the names an admin allows in Settings → Egress, which hostd writes
      # to this file, each with the same leading dot, and has Squid read again
      # when the list is saved: no apply, no reset, and the tasks running keep
      # running. hostd writes only what a person saved there, never a name a
      # repository's own files give.
      acl allowed_extra dstdomain -n "/var/lib/openadlc/egress/extra-domains"
      acl to_ip_literal dstdom_regex -n ^[0-9.]+$ ^\[ :
      acl SSL_ports port 443
      acl Safe_ports port 80 443
      acl CONNECT method CONNECT

      http_access deny !Safe_ports
      http_access deny CONNECT !SSL_ports

      # The refusal, and the line that becomes a metric.
      http_access deny to_ip_literal
      http_access allow allowed_domains
      http_access allow allowed_extra
      http_access deny all

      http_port 3128

      # No caching: a package a bot installs must be the one the registry has.
      cache deny all

      # One line per request, to the host's syslog socket, so journald has it
      # and the platform's log agent ships it; a denial becomes searchable, and
      # TCP_DENIED is what the metric counts. Not stdout: squid opens its logs
      # after dropping to the `proxy` user, which cannot open the container's
      # stdout, and the proxy died at boot with every unit behind it.
      logfile_rotate 0
      access_log syslog:local4.info squid
      cache_log /var/log/squid/cache.log

  # Where hostd writes the names Settings allows, as uid 1000, and the proxy
  # reads them. Made before the proxy starts, with the file, so the proxy's
  # configuration never names a file that is not there; hostd writes it again
  # from Settings at every start of its own.
  - path: /etc/openadlc/egress-extra.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -uo pipefail
      dir=/var/lib/openadlc/egress
      mkdir -p "$dir"
      chown 1000:1000 "$dir" && chmod 0755 "$dir"
      if [ ! -e "$dir/extra-domains" ]; then
        echo '# hostd writes the names Settings → Egress allows here' > "$dir/extra-domains"
        chown 1000:1000 "$dir/extra-domains" && chmod 0644 "$dir/extra-domains"
      fi

  - path: /etc/systemd/system/openadlc-egress-proxy.service
    permissions: '0644'
    content: |
      [Unit]
      Description=The egress allowlist
      After=docker.service
      Requires=docker.service

      [Service]
      Restart=always
      ExecStartPre=/bin/bash /etc/openadlc/egress-extra.sh
      ExecStartPre=-/usr/bin/docker rm -f openadlc-egress
      # The directory, not the file: hostd replaces the file by a rename, and
      # a mount of the file itself would keep showing the one it replaced.
      ExecStart=/usr/bin/docker run --rm --name openadlc-egress \
        --network host \
        -v /etc/openadlc/squid.conf:/etc/squid/squid.conf:ro \
        -v /var/lib/openadlc/egress:/var/lib/openadlc/egress:ro \
        -v /dev/log:/dev/log \
        ${proxy_image}
      ExecStop=/usr/bin/docker stop openadlc-egress

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/openadlc-egress-firewall.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Force container egress through the proxy
      After=openadlc-egress-proxy.service docker.service
      Requires=openadlc-egress-proxy.service docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=true
      # A bot container that sets its own HTTP_PROXY to nothing, or speaks to an
      # address it resolved itself, would otherwise leave the host directly. The
      # proxy is an allowlist; this is what makes it the only way out.
      #
      # FORWARD is the chain container traffic crosses, and DOCKER-USER is the
      # one place in it Docker neither reorders nor flushes. Hooked straight into
      # FORWARD, the rule landed behind Docker's own ACCEPTs when the daemon
      # (re)built its chains, and a bot on the first cloud host reached
      # example.com directly and read the host's token from the metadata server.
      # Anything from a docker bridge heading off-host is dropped unless it is
      # DNS, or between containers on the docker ranges. The proxy is on the
      # host itself, so it is INPUT, not FORWARD, that a bot reaches it through.
      #
      # The metadata server answers DNS and nothing else. It also hands out the
      # host's service-account token, and that account reads every secret the
      # install holds — a bot that could fetch it would have every other bot's
      # GitHub credential. The VPC is closed for the same reason: Cloud SQL and
      # hostd's own port are there, and a bot has no business with either
      # except through host.docker.internal.
      #
      # INPUT, because Container-Optimized OS drops by default: hostd's port has
      # to admit the load balancer, the bridge (both already narrowed by the VPC
      # firewall) and the bots on their docker bridges, and the proxy has to
      # admit the bots. So does the task database server, which hostd publishes
      # on the bridge's gateway only (47433): a task's container reaches it as
      # host.docker.internal from the openadlc-tasks bridge, and nothing off
      # the host can, since nothing else is admitted on that port.
      #
      # OUTPUT, for hostd: it runs on the host's network as uid 1000, so its
      # traffic never crosses FORWARD, and the VPC lets 443 out to anywhere.
      # Something in hostd that ignores the proxy variables, holding every
      # bot's credential, would otherwise reach any address on 443. A new
      # connection from that uid may go to the proxy and anything else on the
      # host, the metadata server, the docker bridges (task containers and the
      # task database) and the VPC (Cloud SQL), and nowhere else. Uid 1000 is
      # also `bot` inside the containers, but their traffic crosses FORWARD.
      ExecStart=/bin/sh -c '\
        iptables -C INPUT -p tcp --dport ${hostd_port} -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p tcp --dport ${hostd_port} -j ACCEPT; \
        iptables -C INPUT -i br+ -p tcp --dport 3128 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -i br+ -p tcp --dport 3128 -j ACCEPT; \
        iptables -C INPUT -i br+ -p tcp --dport 47433 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -i br+ -p tcp --dport 47433 -j ACCEPT; \
        iptables -C INPUT -i docker0 -p tcp --dport 3128 -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -i docker0 -p tcp --dport 3128 -j ACCEPT; \
        iptables -N OPENADLC_EGRESS 2>/dev/null || true; \
        iptables -F OPENADLC_EGRESS; \
        iptables -A OPENADLC_EGRESS -d 169.254.169.254/32 -p udp --dport 53 -j RETURN; \
        iptables -A OPENADLC_EGRESS -d 169.254.169.254/32 -p tcp --dport 53 -j RETURN; \
        iptables -A OPENADLC_EGRESS -d 172.16.0.0/12 -j RETURN; \
        iptables -A OPENADLC_EGRESS -d 192.168.0.0/16 -j RETURN; \
        iptables -A OPENADLC_EGRESS -j LOG --log-prefix "openadlc-egress-denied " --log-level 4; \
        iptables -A OPENADLC_EGRESS -j REJECT --reject-with icmp-port-unreachable; \
        iptables -N DOCKER-USER 2>/dev/null || true; \
        iptables -C DOCKER-USER -i br+ -j OPENADLC_EGRESS 2>/dev/null || iptables -I DOCKER-USER 1 -i br+ -j OPENADLC_EGRESS; \
        iptables -C DOCKER-USER -i docker0 -j OPENADLC_EGRESS 2>/dev/null || iptables -I DOCKER-USER 1 -i docker0 -j OPENADLC_EGRESS; \
        iptables -N OPENADLC_HOSTD 2>/dev/null || true; \
        iptables -F OPENADLC_HOSTD; \
        iptables -A OPENADLC_HOSTD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT; \
        iptables -A OPENADLC_HOSTD -d 127.0.0.0/8 -j ACCEPT; \
        iptables -A OPENADLC_HOSTD -d 169.254.169.254/32 -j ACCEPT; \
        iptables -A OPENADLC_HOSTD -d 172.16.0.0/12 -j ACCEPT; \
        iptables -A OPENADLC_HOSTD -d 192.168.0.0/16 -j ACCEPT; \
        iptables -A OPENADLC_HOSTD -d 10.0.0.0/8 -j ACCEPT; \
        iptables -A OPENADLC_HOSTD -j LOG --log-prefix "openadlc-egress-denied " --log-level 4; \
        iptables -A OPENADLC_HOSTD -j REJECT --reject-with icmp-port-unreachable; \
        iptables -C OUTPUT -m owner --uid-owner 1000 -j OPENADLC_HOSTD 2>/dev/null || iptables -I OUTPUT 1 -m owner --uid-owner 1000 -j OPENADLC_HOSTD'

      [Install]
      WantedBy=multi-user.target

  # Which hostd image this start runs, pulled before anything needs it. An
  # update names it in /var/lib/openadlc/hostd-image, one image reference: hostd
  # writes it when the bridge asks it to restart onto a release (POST
  # /internal/restart-onto-image), and `openadlc cloud update` over IAP. The
  # bot image is not a release's, and stays bot_image (see the unit).
  #
  # The file counts only when it names this install's own release image by
  # digest through its mirror, exactly ${hostd_release_image}@sha256:<64 hex>
  # (<mirror>/<owner>/<repo in lower case>/service at a digest). Empty, as this
  # makes it, is no update yet. Anything else, a tag, another package on
  # ghcr.io (which the mirror would pull as readily), or a line cut short by a
  # crash between hostd's truncate and its write, is logged and passed over: a
  # file that cannot be read must never keep hostd from starting.
  #
  # What it is passed over for is the image hostd last started on and
  # answered from, which hostd-started.sh records in a file of root's, held to
  # the same form; then hostd_image. hostd_image alone would be the release
  # the install was made with, under a database newer ones have migrated. A
  # file that does name a release image which will not pull fails the start
  # instead, and systemd tries again ten seconds later, for the same reason.
  - path: /etc/openadlc/hostd-image.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -uo pipefail
      root=/var/lib/openadlc
      file=$root/hostd-image
      started=$root/hostd-image.started
      want='${hostd_release_image}'
      mkdir -p "$root" /run/openadlc

      say() { echo "[openadlc-hostd] $*" >&2; }

      # hostd writes the file in place, as uid 1000, and $root is root's: so
      # the file is made here, empty, and made hostd's at every start, also
      # after `openadlc cloud update` has moved a root-owned one over it. Only
      # that file: hostd gets no say over anything else in $root, the record
      # of what last started included.
      [ -e "$file" ] || : > "$file"
      chown 1000:1000 "$file" && chmod 0644 "$file" || say "could not give hostd $file: an update cannot write it"

      # The image a file names, when it is `want` at a digest.
      named() {
        local ref digest
        [ -f "$1" ] || return 1
        ref=$(head -c 512 "$1") || return 1
        digest=$(printf '%s' "$ref" | sed -n 's/^.*@sha256:\([0-9a-f]\{64\}\)$/\1/p')
        [ -n "$digest" ] && [ "$ref" = "$want@sha256:$digest" ] || return 1
        printf '%s' "$ref"
      }

      # A digest is the same bytes for ever, so one this host has is the one
      # asked for. A tag is pulled at every start, as before: whoever pushed
      # a new build under it meant it to run.
      ensure() {
        case "$1" in
          *@sha256:*) docker image inspect "$1" >/dev/null 2>&1 || docker pull "$1" >&2 ;;
          *) docker pull "$1" >&2 ;;
        esac
      }

      if image=$(named "$file"); then
        ensure "$image" || { say "could not pull $image, which $file names; systemd starts hostd again in ten seconds"; exit 1; }
      else
        [ ! -s "$file" ] || say "$file does not name $want@sha256:<64 hex>, so it is passed over"
        image=
        if last=$(named "$started"); then
          if ensure "$last"; then image=$last; else say "could not pull $last, which hostd last started on"; fi
        fi
        if [ -z "$image" ]; then
          image='${hostd_image}'
          ensure "$image" || { say "could not pull hostd_image, $image"; exit 1; }
        fi
      fi
      # What prepare-hostd.sh and the unit's ExecStart run.
      printf '%s\n' "$image" > /run/openadlc/running-hostd-image
      say "hostd runs $image"

  # What hostd-image.sh falls back to: the image this start ran, once hostd
  # answers on it. Only then, so an image that never came up is never the
  # fallback. A new file moved over the old, both root's. It never fails the
  # start (ExecStartPost=-): a hostd slow to answer just leaves the last record.
  - path: /etc/openadlc/hostd-started.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -uo pipefail
      image=$(cat /run/openadlc/running-hostd-image) || exit 0
      for _ in $(seq 1 60); do
        if curl -sf -o /dev/null --max-time 2 http://127.0.0.1:${hostd_port}/healthz; then
          printf '%s\n' "$image" > /var/lib/openadlc/hostd-image.started.next &&
            mv -f /var/lib/openadlc/hostd-image.started.next /var/lib/openadlc/hostd-image.started
          exit 0
        fi
        sleep 2
      done
      echo "[openadlc-hostd] hostd did not answer on $image within a few minutes, so it is not recorded as the image to fall back to" >&2

  # What hostd needs that cannot be written here: the database URL carries a
  # generated password, so it is read from Secret Manager at each start rather
  # than baked into metadata anyone with compute.instances.get can read.
  #
  # And the app itself, copied out of the image onto the host at the same path
  # it runs from. hostd hands the Docker daemon bind-mount sources — the skills,
  # the roles, the skill runner beside its own main.js, every bot's work
  # directory — and the daemon reads those as paths on the host. Run from /app
  # inside its container, hostd named paths that did not exist out here, and
  # every bot came up with empty mounts.
  - path: /etc/openadlc/prepare-hostd.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      root=/var/lib/openadlc
      # The image hostd-image.sh chose for this start.
      hostd_in_use=$(cat /run/openadlc/running-hostd-image)
      mkdir -p "$root/home" "$root/work" "$root/logins"
      # hostd runs as the bots' uid (see the unit), so what it makes — worktrees,
      # sign-in folders — is theirs inside the containers too. Created by root,
      # the first cloud host's bots could not open their own sign-in folder.
      chown -R 1000:1000 "$root/home" "$root/work" "$root/logins"

      # /var is noexec on Container-Optimized OS, and a bind mount inherits it:
      # a bot could not run a script in its own worktree. The same remount the
      # platform's GPU driver install uses.
      if ! mountpoint -q "$root"; then mount --bind "$root" "$root"; fi
      mount -o remount,bind,exec "$root"

      md=http://metadata.google.internal/computeMetadata/v1
      token=$(curl -sf -H 'Metadata-Flavor: Google' "$md/instance/service-accounts/default/token" \
        | sed -E 's/.*"access_token":"([^"]+)".*/\1/')
      database_url=$(curl -sf -H "Authorization: Bearer $token" \
        "https://secretmanager.googleapis.com/v1/projects/${project_id}/secrets/${database_secret}/versions/latest:access" \
        | grep -o '"data": *"[^"]*"' | sed -E 's/.*"([^"]*)"$/\1/' | base64 -d)

      # The database's certificate authority, where the URL's `sslrootcert`
      # looks for it (main.tf, database_ca_dir): the instance refuses a
      # connection that is not encrypted, and the URL checks the server against
      # this file. Before the umask below, so hostd and the migrate container,
      # both uid 1000, can read it; it is not a secret.
      ca_dir="$root/database-ca"
      mkdir -p "$ca_dir"
      chmod 0755 "$ca_dir"
      curl -sf -H "Authorization: Bearer $token" \
        "https://secretmanager.googleapis.com/v1/projects/${project_id}/secrets/${database_ca_secret}/versions/latest:access" \
        | grep -o '"data": *"[^"]*"' | sed -E 's/.*"([^"]*)"$/\1/' | base64 -d > "$ca_dir/server-ca.pem.next"
      chmod 0644 "$ca_dir/server-ca.pem.next"
      mv "$ca_dir/server-ca.pem.next" "$ca_dir/server-ca.pem"

      umask 077
      cat > "$root/hostd.env" <<ENV
      DATABASE_URL=$database_url
      OPENADLC_SECRET_STORE=gcp
      OPENADLC_GCP_PROJECT=${project_id}
      OPENADLC_HOSTD_DRIVER=docker
      OPENADLC_HOSTD_PORT=${hostd_port}
      OPENADLC_HOST_NAME=${host_name}
      OPENADLC_HOST_ZONE=${zone}
      OPENADLC_BRIDGE_URL=${bridge_url}
      OPENADLC_CONSOLE_URL=https://${console_domain}
      OPENADLC_BOT_IMAGE=${bot_image}
      OPENADLC_RELEASE_MIRROR=${release_mirror}
      OPENADLC_RELEASE_REPO=${release_repository}
      OPENADLC_BOT_EGRESS_PROXY=http://host.docker.internal:3128
      OPENADLC_EGRESS_HOSTS_FILE=/var/lib/openadlc/egress/extra-domains
      OPENADLC_EGRESS_PROXY_CONTAINER=openadlc-egress
      OPENADLC_HOME=$root/home
      OPENADLC_WORK_ROOT=$root/work
      OPENADLC_LOGIN_ROOT=$root/logins
      OPENADLC_SKILLS_ROOT=$root/assets/skills
      OPENADLC_ROLES_ROOT=$root/assets/roles
      OPENADLC_RUNNER_BUNDLE=$root/assets/skill-runner.bundle.mjs
      OPENADLC_GH_SHIM_DIR=$root/assets/gh-shim
      OPENADLC_GITHUB_ORG=${github_org}
      OPENADLC_GITHUB_CLIENT_ID=${github_client}
      OPENADLC_HUMANS=${humans}
      OPENADLC_AUTOMATION_BOT=${automation_bot}
      OPENADLC_REGISTRY_HOST=${registry_host}
      HTTP_PROXY=http://127.0.0.1:3128
      HTTPS_PROXY=http://127.0.0.1:3128
      NO_PROXY=127.0.0.1,localhost,169.254.169.254,metadata.google.internal
      NODE_USE_ENV_PROXY=1
      ENV

      # What follows is read by hostd and by the task computers, as uid 1000.
      umask 022

      # Empties a directory and fills it again from another, rather than
      # replacing it: a task computer's bind mount holds the directory it was
      # made with, and a computer that outlives hostd's restart keeps it.
      refill() {
        mkdir -p "$2"
        find "$2" -mindepth 1 -delete
        cp -R "$1/." "$2/"
      }

      # Only when the image changed. Task computers mount the skills, the
      # roles, the gh and git wrappers and the skill runner from this tree.
      # When it was swapped for a fresh copy, a computer that outlived hostd's
      # restart read an empty /skills and /roles, had no openadlc-ci, and
      # found the real gh and git first on its PATH. So the tree is refreshed
      # where it is: those directories are refilled, the runner is written
      # over, and the rest, which no computer mounts, is replaced. Nothing is
      # restarted: restarting a computer ends the session in it.
      image_id=$(docker image inspect -f '{{.Id}}' "$hostd_in_use")
      if [ ! -d "$root/app" ] || [ "$(cat "$root/app.image" 2>/dev/null)" != "$image_id" ]; then
        rm -rf "$root/app.next"
        docker rm -f openadlc-app-source >/dev/null 2>&1 || true
        docker create --name openadlc-app-source "$hostd_in_use" >/dev/null
        docker cp openadlc-app-source:/app "$root/app.next"
        docker rm openadlc-app-source >/dev/null
        if [ ! -d "$root/app" ]; then
          mv "$root/app.next" "$root/app"
        else
          for dir in crew/skills crew/roles apps/hostd/bin; do
            refill "$root/app.next/$dir" "$root/app/$dir"
          done
          mkdir -p "$root/app/apps/hostd/dist"
          cp "$root/app.next/apps/hostd/dist/skill-runner.bundle.mjs" "$root/app/apps/hostd/dist/skill-runner.bundle.mjs"
          # Everything else goes, except the directories on the way to those
          # four, and the new image's copy is laid over what is left.
          find "$root/app" -mindepth 1 \
            \( -path "$root/app/crew/skills" -o -path "$root/app/crew/roles" -o -path "$root/app/apps/hostd/bin" \
              -o -path "$root/app/apps/hostd/dist/skill-runner.bundle.mjs" \) -prune \
            -o \( -path "$root/app/crew" -o -path "$root/app/apps" -o -path "$root/app/apps/hostd" -o -path "$root/app/apps/hostd/dist" \) \
            -o -prune -exec rm -rf {} +
          cp -R "$root/app.next/." "$root/app/"
          rm -rf "$root/app.next"
        fi
        echo "$image_id" > "$root/app.image"
      fi

      # What a task computer mounts, in directories of their own outside the
      # app tree (hostd.env names them, as the compose stack does), refilled
      # on every start so the image's own copy is what runs. Computers made
      # before these existed mount the app tree, which is why that is
      # refreshed in place as well.
      refill "$root/app/crew/skills" "$root/assets/skills"
      refill "$root/app/crew/roles" "$root/assets/roles"
      refill "$root/app/apps/hostd/bin" "$root/assets/gh-shim"
      # Written over in place, so a mount of the file keeps seeing it.
      cp "$root/app/apps/hostd/dist/skill-runner.bundle.mjs" "$root/assets/skill-runner.bundle.mjs"
      chown -R 1000:1000 "$root/assets"

      # The schema, then the crew from config/bots.yaml placed on this host —
      # what `openadlc up` does on a laptop. A failed migration stops hostd: it
      # must not run on a schema it does not know. A seat the seed refuses is a
      # warning, as under `openadlc up`: the refusal comes from the database
      # and never clears, and as a failure it held the only host in a restart
      # loop with no hostd at all.
      docker run --rm --network host --env-file "$root/hostd.env" \
        -v "$root:$root" -w "$root/app" "$hostd_in_use" \
        sh -c 'node packages/db/dist/cli/migrate.js && { node packages/db/dist/cli/seed.js || echo "[prepare-hostd] the seed reported a problem; hostd starts anyway" >&2; }'

  - path: /etc/systemd/system/openadlc-hostd.service
    permissions: '0644'
    content: |
      [Unit]
      Description=hostd
      After=openadlc-egress-firewall.service
      Requires=openadlc-egress-firewall.service

      [Service]
      Restart=always
      RestartSec=10
      # Where docker-credential-gcr writes the registry login. Root's home is
      # read-only on Container-Optimized OS.
      Environment=HOME=/var/lib/openadlc/home
      ExecStartPre=/bin/mkdir -p /var/lib/openadlc/home
      ExecStartPre=/usr/bin/docker-credential-gcr configure-docker --registries=${region}-docker.pkg.dev
      # The bot image, before hostd needs it. Without this the host came up
      # healthy and every task failed to start, because the docker driver had no
      # image to run a bot from and nothing had ever pulled one.
      #
      # Only when the host has none. From then on the tag is the host's own:
      # the weekly engine update rebuilds it here and moves it, and pulled on
      # every start, the registry's copy would put the old engines back under
      # the bots at the next restart, with nothing recorded. To seed a host
      # with a newer registry image, `docker pull` it by hand.
      ExecStartPre=/bin/sh -c '/usr/bin/docker image inspect ${bot_image} >/dev/null 2>&1 || exec /usr/bin/docker pull ${bot_image}'
      # hostd's own image, chosen and pulled (hostd-image.sh).
      ExecStartPre=/bin/bash /etc/openadlc/hostd-image.sh
      ExecStartPre=/bin/bash /etc/openadlc/prepare-hostd.sh
      ExecStartPre=-/usr/bin/docker rm -f openadlc-hostd
      # hostd itself goes through the proxy too. It is the thing that talks to
      # GitHub on a task's behalf, and an allowlist that exempts the component
      # with the credentials is not an allowlist. Two things hold it: the proxy
      # variables in hostd.env, with NODE_USE_ENV_PROXY, without which Node's
      # own fetch ignores the rest and went straight out; and the OUTPUT rule
      # in openadlc-egress-firewall, which refuses a new connection from hostd's
      # uid to anything but the host itself (the proxy), the metadata server,
      # the docker bridges and the VPC.
      #
      # The browser opens /terminal from the console's domain, and the gateway
      # admits only the console it is told about.
      #
      # As uid 1000, the `bot` user in the bot image, with the socket's group so
      # it can still drive Docker. Docker Desktop hides ownership from a Mac;
      # Linux does not, and everything hostd made as root was unwritable to the
      # bot that had to use it. `%%g` because systemd reads `%g` as its own
      # specifier (the manager's group) and hostd got root's group, not docker's.
      #
      # The image is the one hostd-image.sh chose: what the file names when it
      # is exactly ${hostd_release_image}@sha256:<64 hex> (<mirror>/<owner>/
      # <repo in lower case>/service at a digest), else hostd_image. hostd is
      # told that reference (OPENADLC_HOSTD_IMAGE) and reports it, so the
      # bridge confirms a roll by what started rather than by what the file
      # says. The file is where hostd writes the next one when it is asked to
      # restart onto a release; it then exits, and Restart=always brings it
      # back on that.
      ExecStart=/bin/sh -c 'image=$$(cat /run/openadlc/running-hostd-image) && exec /usr/bin/docker run --rm --name openadlc-hostd \
        --network host \
        --user 1000:1000 \
        --group-add $$(stat -c %%g /var/run/docker.sock) \
        -e HOME=/var/lib/openadlc/home \
        -e OPENADLC_HOSTD_IMAGE="$$image" \
        -e OPENADLC_HOSTD_IMAGE_FILE=/var/lib/openadlc/hostd-image \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v /var/lib/openadlc:/var/lib/openadlc \
        -w /var/lib/openadlc/app \
        --env-file /var/lib/openadlc/hostd.env \
        "$$image" node apps/hostd/dist/main.js'

      # hostd ends each running task on SIGTERM: a few docker execs, a git
      # harvest and a docker rm for every one, which docker stop's default 10
      # seconds cut off with tasks still open. systemd waits a little longer
      # than docker does, so it never kills the stop itself.
      ExecStop=/usr/bin/docker stop -t 300 openadlc-hostd
      TimeoutStopSec=330

      # The image hostd answered on, recorded for hostd-image.sh to fall back
      # to (hostd-started.sh), never failing the start.
      ExecStartPost=-/bin/bash /etc/openadlc/hostd-started.sh
      # A start is the pulls, the app copied out, the migrations and the wait
      # for hostd to answer, and systemd's default of 90 seconds for all of it
      # would stop one partway through a release's first pull through the
      # mirror. `openadlc cloud update`'s restart waits for the whole of it.
      TimeoutStartSec=15min

      [Install]
      WantedBy=multi-user.target

runcmd:
  # Logging is the platform's own agent on Container-Optimized OS, turned on by
  # the instance's `google-logging-enabled` metadata. The Ops Agent this used to
  # install has no package for COS, and the line failed on every boot.
  - systemctl daemon-reload
  # Before any unit below starts: they make /var/lib/openadlc.
  - /bin/bash /etc/openadlc/from-fleet.sh
  - systemctl enable --now openadlc-egress-proxy.service
  - systemctl enable --now openadlc-egress-firewall.service
  - systemctl enable --now openadlc-hostd.service
